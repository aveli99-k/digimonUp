# 정적 검사 설정.
#
#     python -m ruff check .            # 검사만
#     python -m ruff check --fix .      # 안전한 것은 바로 고친다
#
# 왜 넣었나
#     tools/check.py 는 화면을 캡처하고 유사도를 다 계산한 **뒤에**, 마지막
#     저장 줄에서 NameError 로 죽고 있었다(imwrite 를 가져오지 않았다). 도구는
#     게임을 띄워 놓고 손으로 돌리는 것이라 아무도 몰랐다. F 규칙(pyflakes)이
#     이런 것을 1초에 잡는다. 테스트가 못 보는 자리를 메우는 용도다.
#
# 규칙 고르기
#     F  이름/import 사고 (진짜 버그)      <- 이것 때문에 넣었다
#     E9 문법 오류
#     B  흔한 함정 (bugbear)
#     C4 쓸데없는 컴프리헨션
#     UP 낡은 문법
#
# 서식(줄 길이, 따옴표)은 손대지 않는다. 이 저장소의 주석은 실측 기록이라
# 자동 정렬로 뭉개면 안 된다.

target-version = "py310"
line-length = 100

[lint]
select = ["F", "E4", "E7", "E9", "B", "C4", "UP"]
ignore = [
    "E501",     # 줄 길이. 한글 주석이 많아 기계적으로 자르면 읽기 나빠진다
    "UP006",    # dict/list 대문자 표기. 이 코드베이스는 이미 소문자다
    "UP007",
    "UP035",
    "UP045",
    "B905",     # zip(strict=) — 길이가 같은 것이 이미 보장된 자리들이다
    "B008",
]

[lint.per-file-ignores]
# 도구들은 저장소 루트를 sys.path 에 넣은 **뒤에** digimonup 을 가져와야 한다.
"tools/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# 테스트는 한 줄에 여러 문장을 두는 편이 대본을 읽기 쉬울 때가 있고,
# 설정 기본값은 dict(a=1, ...) 로 적어야 항목마다 주석을 달 수 있다.
"tests/*.py" = ["E402", "E701", "E702", "C408"]
